name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Core policy checks
        shell: bash
        run: |
          mkdir -p app/build/core-tests
          javac -encoding UTF-8 -d app/build/core-tests app/src/main/java/com/qingping/app/SkipPolicy.java tools/PolicyChecks.java
          java -cp app/build/core-tests com.qingping.app.PolicyChecks
      - name: Build APK and run Lint
        run: bash gradlew assembleDebug lintDebug --no-daemon --console plain
      - name: Prepare verified APK
        id: metadata
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(python3 -c "import re; print(re.search(r\"versionName\s+'([^']+)'\", open('app/build.gradle', encoding='utf-8').read()).group(1))")
          if [[ "$REF_TYPE" == tag && "$REF_NAME" != "v$version" ]]; then
            echo 'Version tag must match app/build.gradle versionName.' >&2
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/LightStart-$version-debug.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Upload APK for this commit
        uses: actions/upload-artifact@v4
        with:
          name: LightStart-${{ steps.metadata.outputs.version }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90
      - name: Upload Lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-${{ github.run_id }}
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LightStart-${{ needs.build.outputs.version }}-${{ github.sha }}
          path: dist
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          APP_VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --title "LightStart $APP_VERSION" --notes 'Offline splash-ad skipping for Android 8.0 or later. Assets include a CI debug-signed APK and SHA-256 checksums. Its signing key may differ from local installations and previous builds. See the repository documentation for setup, changes and validation limits.'
          fi
